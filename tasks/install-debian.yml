---

- name: Обновление кэша пакетов APT
  ansible.builtin.apt:
    update_cache: true
  tags:
    - vector
    - system

- name: Установка ca-certificates
  ansible.builtin.apt:
    name: ca-certificates
  tags:
    - vector

- name: Скачивание DEB-пакета Vector
  ansible.builtin.get_url:
    url: "https://packages.timber.io/vector/{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
    dest: "/tmp/vector-{{ vector_version }}.deb"
    mode: '0644'
  tags:
    - vector

- name: Установка пакета Vector
  ansible.builtin.apt:
    deb: "/tmp/vector-{{ vector_version }}.deb"
  notify: Запустить сервис vector
  tags:
    - vector

- name: Развёртывание конфигурационного файла Vector из шаблона
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    mode: '0644'
  notify: Перезапустить сервис vector
  tags:
    - vector
    - vector_config

- name: Принудительный запуск сервиса
  ansible.builtin.meta: flush_handlers
  tags:
    - vector

...